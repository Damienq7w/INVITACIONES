<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis XV Años - Madeleine</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body {
  min-height:100vh;
  background: radial-gradient(ellipse at center, #1a0030 0%, #080012 60%, #000 100%);
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; overflow-x:hidden;
}
#scene {
  width:100%; min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; position:relative; overflow:hidden; padding:40px 20px;
}
.star {
  position:fixed; background:#fff; border-radius:50%;
  animation:twinkle var(--d) ease-in-out infinite alternate; pointer-events:none;
}
@keyframes twinkle {
  from { opacity:0.1; transform:scale(0.8); }
  to   { opacity:0.9; transform:scale(1.3); }
}
.butterfly {
  position:fixed; pointer-events:none;
  animation:flybt var(--fd) ease-in-out infinite alternate;
  opacity:0.75; z-index:1;
}
@keyframes flybt {
  0%   { transform:translate(0,0) rotate(-8deg) scaleX(1); }
  50%  { transform:translate(var(--tx),var(--ty)) rotate(6deg) scaleX(-1); }
  100% { transform:translate(calc(var(--tx)*1.3),calc(var(--ty)*0.4)) rotate(-4deg) scaleX(1); }
}
@keyframes wingsf {
  0%,100% { transform:scaleY(1); }
  50%      { transform:scaleY(0.55); }
}
.butterfly svg { animation:wingsf 0.5s ease-in-out infinite; transform-origin:center; }

/* ENVELOPE */
#envelope-section { display:flex; flex-direction:column; align-items:center; gap:20px; position:relative; z-index:10; }
#envelope-wrap { cursor:pointer; perspective:1000px; }
#envelope {
  width:320px; height:220px; position:relative;
  filter:drop-shadow(0 0 30px rgba(200,0,255,0.5));
  transition:filter 0.3s, transform 0.3s;
}
#envelope:hover { filter:drop-shadow(0 0 55px rgba(220,50,255,0.8)); transform:scale(1.03); }
.env-body {
  width:320px; height:220px;
  background:linear-gradient(145deg,#2d0058,#1a0035);
  border-radius:4px; border:1px solid #9b30ff; position:relative; overflow:visible;
}
.env-fl { position:absolute; width:0; height:0; }
.env-bottom { bottom:0;left:0; border-left:160px solid transparent; border-right:160px solid transparent; border-bottom:112px solid #3a0070; }
.env-left   { top:0;left:0;  border-top:110px solid transparent; border-bottom:110px solid transparent; border-left:132px solid #2c0056; }
.env-right  { top:0;right:0; border-top:110px solid transparent; border-bottom:110px solid transparent; border-right:132px solid #280050; }
.env-top    { top:0;left:0;  border-left:160px solid transparent; border-right:160px solid transparent; border-top:116px solid #3e0082;
  transform-origin:top center; transition:transform 0.9s cubic-bezier(0.4,0,0.2,1); }
.env-top.open { transform:rotateX(180deg); }
.env-seal {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:54px; height:54px;
  background:radial-gradient(circle,#ff80ff,#bb00cc);
  border-radius:50%; border:2px solid #ffccff;
  display:flex; align-items:center; justify-content:center;
  font-family:'Great Vibes',cursive; color:#fff; font-size:24px;
  box-shadow:0 0 18px rgba(255,0,255,0.6); z-index:5;
  transition:opacity 0.4s, transform 0.4s;
}
.env-label {
  position:absolute; bottom:14px; left:0; right:0; text-align:center;
  font-family:'Great Vibes',cursive; color:#e080ff; font-size:17px;
  text-shadow:0 0 10px rgba(200,0,255,0.7);
}
#open-btn {
  background:linear-gradient(135deg,#9b30ff,#cc00cc);
  color:#fff; border:none; padding:13px 36px;
  border-radius:30px; font-family:'Cinzel',serif;
  font-size:14px; letter-spacing:2px; cursor:pointer;
  box-shadow:0 0 25px rgba(155,48,255,0.55); transition:all 0.3s;
}
#open-btn:hover { box-shadow:0 0 45px rgba(210,0,255,0.85); transform:scale(1.06); }

/* CARD */
#card-container {
  display:none; opacity:0;
  transform:translateY(40px) scale(0.93);
  transition:opacity 0.9s ease, transform 0.9s ease;
  width:100%; max-width:480px;
  position:relative; z-index:10;
  flex-direction:column; align-items:center; gap:16px;
}
#card-container.visible { display:flex; }
#card-container.shown { opacity:1; transform:translateY(0) scale(1); }

/* La imagen con fondo degradado elegante */
#inv-card {
  width:100%;
  border-radius:16px;
  overflow:hidden;
  position:relative;
  /* Fondo degradado rosa-morado tipo acuarela */
  background: linear-gradient(135deg,
    #3d0060 0%,
    #5a0080 15%,
    #7b1fa2 30%,
    #4a0070 45%,
    #2d0050 60%,
    #6a0090 75%,
    #3d0060 100%
  );
  box-shadow:
    0 0 0 3px #9b30ff,
    0 0 0 6px rgba(155,48,255,0.3),
    0 0 60px rgba(180,0,255,0.6),
    0 0 120px rgba(100,0,200,0.35);
  animation:cardPulse 4s ease-in-out infinite;
}

/* Capa decorativa de textura encima del fondo */
#inv-card::before {
  content:'';
  position:absolute; inset:0; z-index:1; pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(200,100,255,0.25) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(180,0,200,0.2) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 10%, rgba(255,150,255,0.15) 0%, transparent 40%);
}

#inv-card img {
  width:100%; display:block;
  position:relative; z-index:2;
}

@keyframes cardPulse {
  0%,100% { box-shadow:0 0 0 3px #9b30ff, 0 0 0 6px rgba(155,48,255,0.3), 0 0 60px rgba(180,0,255,0.6), 0 0 120px rgba(100,0,200,0.35); }
  50%      { box-shadow:0 0 0 3px #cc44ff, 0 0 0 8px rgba(200,68,255,0.4), 0 0 90px rgba(220,0,255,0.8), 0 0 160px rgba(140,0,255,0.5); }
}

#close-btn {
  background:transparent; color:#cc88ff;
  border:1px solid #9b30ff; padding:10px 28px;
  border-radius:30px; font-family:'Cinzel',serif;
  font-size:12px; letter-spacing:2px; cursor:pointer; transition:all 0.3s;
}
#close-btn:hover { background:rgba(155,48,255,0.2); box-shadow:0 0 20px rgba(155,48,255,0.4); }

.glitter {
  position:fixed; border-radius:50%; pointer-events:none;
  animation:glitterAnim var(--gd) linear forwards; opacity:0; z-index:999;
}
@keyframes glitterAnim {
  0%   { opacity:0; transform:translate(0,0) scale(0) rotate(0deg); }
  20%  { opacity:1; transform:translate(var(--gx),var(--gy)) scale(1) rotate(120deg); }
  80%  { opacity:0.7; }
  100% { opacity:0; transform:translate(calc(var(--gx)*1.6),calc(var(--gy)*2 + 50px)) scale(0.3) rotate(360deg); }
}
.title-text {
  font-family:'Great Vibes',cursive; color:#e080ff; font-size:22px;
  text-shadow:0 0 20px rgba(200,0,255,0.8); text-align:center; margin-bottom:4px;
  animation:glow 2.5s ease-in-out infinite alternate;
}
@keyframes glow {
  from { text-shadow:0 0 10px rgba(200,0,255,0.5); }
  to   { text-shadow:0 0 30px rgba(255,100,255,1), 0 0 60px rgba(200,0,255,0.6); }
}
</style>
</head>
<body>
<div id="scene">
  <div id="envelope-section">
    <div class="title-text">Una invitación muy especial para ti 💜</div>
    <div id="envelope-wrap" onclick="openEnvelope()">
      <div id="envelope">
        <div class="env-body">
          <div class="env-fl env-left"></div>
          <div class="env-fl env-right"></div>
          <div class="env-fl env-bottom"></div>
          <div class="env-seal" id="seal">M</div>
          <div class="env-label">Toca para abrir ✨</div>
          <div class="env-fl env-top" id="flap-top"></div>
        </div>
      </div>
    </div>
    <button id="open-btn" onclick="openEnvelope()">✨ Abrir Invitación ✨</button>
  </div>

  <div id="card-container">
    <div id="inv-card">
      <img id="inv-img" alt="Invitación XV Años Madeleine" />
    </div>
    <button id="close-btn" onclick="closeCard()">↩ Volver al sobre</button>
  </div>
</div>

document.getElementById('inv-img').src = 'data:image/png;base64,' + IMG_B64;

for (let i=0;i<90;i++) {
  const s=document.createElement('div'); s.className='star';
  const sz=Math.random()*2.5+0.5;
  s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${1.5+Math.random()*3.5}s;`;
  document.body.appendChild(s);
}
const bColors=[['#cc44ff','#aa22dd','#ee66ff','#cc44ee'],['#ff88cc','#dd44aa','#ffaadd','#ff66bb'],['#bb88ff','#9944cc','#ddaaff','#bb66ee'],['#ff44ff','#cc00cc','#ff88ff','#dd22dd']];
const bPos=[{top:'5%',left:'3%'},{top:'8%',right:'5%'},{top:'4%',left:'45%'},{top:'80%',left:'2%'},{top:'78%',right:'4%'},{top:'55%',left:'1%'},{top:'60%',right:'2%'},{top:'28%',left:'0%'},{top:'38%',right:'1%'},{top:'18%',left:'58%'},{top:'90%',left:'35%'},{top:'14%',left:'18%'},{top:'50%',left:'90%'},{top:'70%',left:'50%'},{top:'25%',right:'10%'}];
bPos.forEach((pos,i)=>{
  const b=document.createElement('div'); b.className='butterfly';
  const c=bColors[i%bColors.length]; const size=32+Math.floor(Math.random()*20);
  b.innerHTML=`<svg width="${size}" height="${size}" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="10" cy="15" rx="9" ry="6" fill="${c[0]}" opacity="0.85"/>
    <ellipse cx="10" cy="25" rx="6" ry="4" fill="${c[1]}" opacity="0.75"/>
    <ellipse cx="30" cy="15" rx="9" ry="6" fill="${c[2]}" opacity="0.85"/>
    <ellipse cx="30" cy="25" rx="6" ry="4" fill="${c[3]}" opacity="0.75"/>
    <ellipse cx="20" cy="20" rx="2" ry="7" fill="#220033"/>
    <line x1="20" y1="13" x2="14" y2="7" stroke="#cc88ff" stroke-width="0.8" opacity="0.6"/>
    <line x1="20" y1="13" x2="26" y2="7" stroke="#cc88ff" stroke-width="0.8" opacity="0.6"/>
  </svg>`;
  const tx=(Math.random()-0.5)*100, ty=(Math.random()-0.5)*80;
  const css=Object.entries(pos).map(([k,v])=>`${k}:${v}`).join(';');
  b.style.cssText=`${css};--tx:${tx}px;--ty:${ty}px;--fd:${4+Math.random()*6}s;`;
  document.body.appendChild(b);
});

function spawnGlitter(n=15){
  const colors=['#fff','#ffccff','#cc88ff','#ffaaee','#ff80ff','#ffffcc','#ffddff'];
  for(let i=0;i<n;i++) setTimeout(()=>{
    const g=document.createElement('div'); g.className='glitter';
    const sz=2+Math.random()*5;
    g.style.cssText=`left:${15+Math.random()*70}%;top:${20+Math.random()*60}%;width:${sz}px;height:${sz}px;background:${colors[Math.floor(Math.random()*colors.length)]};--gx:${(Math.random()-0.5)*80}px;--gy:${-20-Math.random()*60}px;--gd:${0.8+Math.random()*1.4}s;`;
    document.body.appendChild(g); setTimeout(()=>g.remove(),2200);
  },i*70);
}

let opened=false;
function openEnvelope(){
  if(opened)return; opened=true;
  document.getElementById('flap-top').classList.add('open');
  const seal=document.getElementById('seal');
  seal.style.transform='translate(-50%,-50%) scale(0)'; seal.style.opacity='0';
  spawnGlitter(30);
  const envSec=document.getElementById('envelope-section');
  setTimeout(()=>spawnGlitter(20),700);
  setTimeout(()=>{ envSec.style.transition='opacity 0.7s,transform 0.7s'; envSec.style.opacity='0'; envSec.style.transform='scale(0.8) translateY(-20px)'; },900);
  setTimeout(()=>{
    envSec.style.display='none';
    const cc=document.getElementById('card-container');
    cc.classList.add('visible'); spawnGlitter(35);
    requestAnimationFrame(()=>requestAnimationFrame(()=>cc.classList.add('shown')));
  },1700);
}
function closeCard(){
  const cc=document.getElementById('card-container'); cc.classList.remove('shown');
  setTimeout(()=>{
    cc.classList.remove('visible');
    const envSec=document.getElementById('envelope-section');
    envSec.style.display='flex'; envSec.style.opacity='0'; envSec.style.transform='scale(0.85)';
    document.getElementById('flap-top').classList.remove('open');
    const seal=document.getElementById('seal');
    seal.style.transform='translate(-50%,-50%) scale(1)'; seal.style.opacity='1';
    opened=false;
    setTimeout(()=>{ envSec.style.transition='opacity 0.5s,transform 0.5s'; envSec.style.opacity='1'; envSec.style.transform='scale(1)'; },50);
  },700);
}
setInterval(()=>spawnGlitter(4),3500);
</script>
